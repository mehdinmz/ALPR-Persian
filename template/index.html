<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع پلاک‌خوان هوشمند (ALPR Gateway)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- هدر سایت -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <span>🚗</span> سامانه مانیتورینگ و پلاک‌خوان هوشمند
            </h1>
            <div id="system-status" class="flex items-center gap-2 text-sm bg-slate-700 px-3 py-1 rounded-full">
                <span class="w-3 h-3 rounded-full bg-red-500" id="status-dot"></span>
                <span id="status-text">در حال بررسی سرویس‌ها...</span>
            </div>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 mt-4">
        
        <!-- ستون کنترل و نمایشگر -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- پنل تنظیمات ورودی -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-slate-200">کنترل جریان ورودی</h2>
                
                <!-- تب‌های انتخاب حالت -->
                <div class="flex flex-wrap gap-2 border-b border-slate-700 pb-3">
                    <button onclick="switchMode('stream')" id="tab-stream" class="px-3 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition">دوربین زنده (RTSP)</button>
                    <button onclick="switchMode('video')" id="tab-video" class="px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 transition">مسیر ویدیو محلی / سرور</button>
                    <button onclick="switchMode('image')" id="tab-image" class="px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 transition">آپلود عکس تکی</button>
                </div>

                <!-- حالت اول: دوربین زنده RTSP -->
                <div id="section-stream" class="space-y-3">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="stream-url" placeholder="rtsp://127.0.0.1:8554/live" 
                               class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500"
                               value="rtsp://127.0.0.1:8554/live">
                        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                            <span class="text-xs text-slate-400">FPS:</span>
                            <input type="number" id="process-fps" value="10" min="1" max="60" class="w-12 bg-transparent text-center text-sm font-bold focus:outline-none text-emerald-400">
                        </div>
                    </div>
                    <div>
                        <button onclick="startStream()" id="btn-start" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg text-sm font-medium transition">
                            شروع استریم
                        </button>
                    </div>
                </div>

                <!-- حالت دوم: ویدیوی ضبط شده با مسیر محلی -->
                <div id="section-video" class="hidden space-y-3">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="video-path-input" placeholder="مسیر کامل فایل ویدیو (مثلا C:/videos/car.mp4)" 
                               class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                            <span class="text-xs text-slate-400">FPS:</span>
                            <input type="number" id="video-process-fps" value="10" min="1" max="60" class="w-12 bg-transparent text-center text-sm font-bold focus:outline-none text-emerald-400">
                        </div>
                    </div>
                    <div>
                        <button onclick="startVideoFile()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg text-sm font-medium transition">
                            پردازش فایل ویدیو
                        </button>
                    </div>
                </div>

                <!-- حالت سوم: آپلود عکس تکی -->
                <div id="section-image" class="hidden flex flex-col sm:flex-row gap-3 items-center">
                    <input type="file" id="image-file-input" accept="image/*" 
                           class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm file:bg-slate-800 file:text-slate-200 file:border-0 file:rounded file:px-3 file:py-1 cursor-pointer">
                    <button onclick="processSingleImage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                        تشخیص پلاک تصویر
                    </button>
                </div>

                <!-- دکمه‌ی توقف عمومی (همیشه در دسترس برای استریم و ویدیو) -->
                <div class="pt-3 border-t border-slate-700 flex justify-end">
                    <button onclick="stopStream()" id="btn-stop" disabled class="bg-red-600/50 text-white px-6 py-2 rounded-lg text-sm font-medium transition cursor-not-allowed">
                        توقف کامل پردازش ⏹️
                    </button>
                </div>
            </div>

            <!-- نمایشگر تصویر / ویدیو -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h2 id="viewer-title" class="text-lg font-semibold text-slate-200">نمایشگر تصویر</h2>
                    <span id="fps-counter" class="text-xs text-slate-400 bg-slate-900 px-2.5 py-1 rounded">آماده</span>
                </div>
                <div class="aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center border border-slate-700 relative">
                    <div id="placeholder-text" class="absolute text-slate-500 text-sm">تصویر یا ویدیو اینجا نمایش داده می‌شود</div>
                    <img id="live-video-feed" src="" class="w-full h-full object-contain hidden" alt="Feed">
                </div>
            </div>
        </div>

        <!-- ستون جدول و آمار -->
        <div class="space-y-6">
            
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg grid grid-cols-2 gap-4">
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">پلاک‌های منحصربه‌فرد</span>
                    <span id="stat-total-plates" class="text-2xl font-bold text-emerald-400">0</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-center">
                    <span class="text-xs text-slate-400 block">پردازش</span>
                    <span id="stat-status" class="text-sm font-bold text-amber-400 mt-1 block">غیرفعال</span>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-slate-200">تاریخچه پلاک‌های خوانده‌شده</h2>
                    <button onclick="downloadJson()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded transition">
                        دانلود JSON 📥
                    </button>
                </div>
                
                <div class="overflow-y-auto max-h-[400px] rounded-lg border border-slate-700 bg-slate-900">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-800 text-slate-400 sticky top-0">
                            <tr>
                                <th class="p-3">شناسه / پلاک</th>
                                <th class="p-3">اطمینان</th>
                                <th class="p-3">زمان ثبت</th>
                            </tr>
                        </thead>
                        <tbody id="plates-table-body" class="divide-y divide-slate-800">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-slate-500">هنوز پلاک جدیدی ثبت نشده است</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let currentStreamId = null;
        let pollingInterval = null;

        // بررسی خودکار سلامت سرویس‌ها هنگام لود صفحه و تکرار آن هر ۵ ثانیه
        async function checkSystemHealth() {
            try {
                const response = await fetch('/health');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                    document.getElementById('status-text').innerText = "Running";
                } else {
                    setSystemDown();
                }
            } catch (err) {
                setSystemDown();
            }
        }

        function setSystemDown() {
            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-red-500";
            document.getElementById('status-text').innerText = "Stopped";
        }

        // اجرای اولیه و تنظیم بررسی دوره‌ای هر ۵ ثانیه
        checkSystemHealth();
        setInterval(checkSystemHealth, 5000);

        function switchMode(mode) {
            const tabStream = document.getElementById('tab-stream');
            const tabVideo = document.getElementById('tab-video');
            const tabImage = document.getElementById('tab-image');
            
            const secStream = document.getElementById('section-stream');
            const secVideo = document.getElementById('section-video');
            const secImage = document.getElementById('section-image');
            const viewerTitle = document.getElementById('viewer-title');

            tabStream.className = "px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 transition";
            tabVideo.className = "px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 transition";
            tabImage.className = "px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 text-slate-300 transition";

            secStream.classList.add('hidden');
            secVideo.classList.add('hidden');
            secImage.classList.add('hidden');

            if (mode === 'stream') {
                tabStream.className = "px-3 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition";
                secStream.classList.remove('hidden');
                viewerTitle.innerText = "نمایشگر دوربین زنده";
            } else if (mode === 'video') {
                tabVideo.className = "px-3 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition";
                secVideo.classList.remove('hidden');
                viewerTitle.innerText = "نمایشگر ویدیوی ضبط شده";
            } else {
                tabImage.className = "px-3 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white transition";
                secImage.classList.remove('hidden');
                viewerTitle.innerText = "تصویر پردازش‌شده";
            }
        }

        async function startStream() {
            const url = document.getElementById('stream-url').value.trim();
            const fps = parseFloat(document.getElementById('process-fps').value) || 10;
            if (!url) {
                alert('لطفاً آدرس RTSP را وارد کنید.');
                return;
            }
            sendStartRequest(url, fps);
        }

        async function startVideoFile() {
            const path = document.getElementById('video-path-input').value.trim();
            const fps = parseFloat(document.getElementById('video-process-fps').value) || 10;
            if (!path) {
                alert('لطفاً مسیر فایل ویدیویی را وارد کنید.');
                return;
            }
            sendStartRequest(path, fps);
        }

        async function sendStartRequest(sourceUrl, fps) {
            try {
                const response = await fetch('/streams/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: sourceUrl, process_fps: fps })
                });

                const data = await response.json();
                if (data.success) {
                    currentStreamId = data.stream_id;
                    
                    const imgElement = document.getElementById('live-video-feed');
                    imgElement.src = `/streams/${currentStreamId}/live`;
                    imgElement.classList.remove('hidden');
                    document.getElementById('placeholder-text').classList.add('hidden');

                    document.getElementById('btn-stop').disabled = false;
                    document.getElementById('btn-stop').classList.remove('bg-red-600/50', 'cursor-not-allowed');
                    document.getElementById('btn-stop').classList.add('bg-red-600', 'hover:bg-red-500');

                    document.getElementById('stat-status').innerText = "فعال";

                    startPolling();
                } else {
                    alert('خطا: ' + (data.detail || 'نامشخص'));
                }
            } catch (err) {
                alert('خطای ارتباط با سرور: ' + err.message);
            }
        }

        async function stopStream() {
            if (!currentStreamId) return;
            try {
                await fetch(`/streams/${currentStreamId}/stop`, { method: 'POST' });
            } catch (e) {}
            resetUI();
        }

        async function processSingleImage() {
            const fileInput = document.getElementById('image-file-input');
            if (fileInput.files.length === 0) {
                alert('لطفاً یک عکس انتخاب کنید.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/process/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    const imgElement = document.getElementById('live-video-feed');
                    imgElement.src = URL.createObjectURL(fileInput.files[0]);
                    imgElement.classList.remove('hidden');
                    document.getElementById('placeholder-text').classList.add('hidden');

                    updatePlatesTable(data.detections || []);
                } else {
                    alert('خطا در پردازش تصویر');
                }
            } catch (err) {
                alert('خطای ارتباط با سرور: ' + err.message);
            }
        }

        function resetUI() {
            currentStreamId = null;
            if (pollingInterval) clearInterval(pollingInterval);

            const imgElement = document.getElementById('live-video-feed');
            imgElement.src = "";
            imgElement.classList.add('hidden');
            document.getElementById('placeholder-text').classList.remove('hidden');

            const btnStop = document.getElementById('btn-stop');
            btnStop.disabled = true;
            btnStop.className = "bg-red-600/50 text-white px-6 py-2 rounded-lg text-sm font-medium transition cursor-not-allowed";

            document.getElementById('stat-status').innerText = "غیرفعال";
        }

        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                if (!currentStreamId) return;
                try {
                    const res = await fetch(`/streams/${currentStreamId}/save-json`);
                    if (res.ok) {
                        const data = await res.json();
                        updatePlatesTable(data.plates || []);
                    }
                } catch (e) {}
            }, 3000);
        }

        function updatePlatesTable(plates) {
            const tbody = document.getElementById('plates-table-body');
            document.getElementById('stat-total-plates').innerText = plates.length;

            if (plates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500">پلاکی یافت نشد</td></tr>`;
                return;
            }

            const sorted = [...plates].reverse();
            tbody.innerHTML = sorted.map(p => `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="p-3 font-mono font-bold text-emerald-400 text-right">
                        <bdi style="direction: ltr; unicode-bidi: bidi-override; display: inline-block;">${p.text || '---'}</bdi>
                        <span class="text-xs text-slate-500 font-normal mr-2">(ID: ${p.plate_id || '-'})</span>
                    </td>
                    <td class="p-3 text-slate-300">${p.confidence ? (p.confidence * 100).toFixed(0) + '%' : '---'}</td>
                    <td class="p-3 text-slate-400 text-xs">${p.timestamp ? new Date(p.timestamp * 1000).toLocaleTimeString('fa-IR') : 'همین الان'}</td>
                </tr>
            `).join('');
        }

        function downloadJson() {
            if (!currentStreamId) {
                alert('فایلی برای دانلود وجود ندارد.');
                return;
            }
            window.location.href = `/streams/${currentStreamId}/save-json`;
        }
    </script>
</body>
</html>
